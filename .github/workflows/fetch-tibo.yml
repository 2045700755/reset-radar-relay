name: Fetch Tibo timeline
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch timeline
        env:
          TIBO_USERS: thsottiaux
        run: node scripts/fetch-tibo.mjs
      - name: Commit if changed
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add -A
          git diff --staged --quiet || git commit -m "update timeline"
          git push

